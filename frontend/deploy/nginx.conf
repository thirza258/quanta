map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1500k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens "420" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
    }

    # RFC 9727 API Catalog
    location = /.well-known/api-catalog {
        default_type "application/linkset+json; charset=utf-8";
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Auth.md discovery
    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # RFC 9728 OAuth Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OAuth / OIDC Discovery & Bot Auth
    location ~* ^/\.well-known/(openid-configuration|oauth-authorization-server|agent-card\.json|jwks\.json|http-message-signatures-directory)$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Agent Skills Discovery
    location = /.well-known/agent-skills/index.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SEP-1649 MCP Server Cards
    location ~* ^/\.well-known/mcp/.*\.json$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/mcp.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Skill markdown artifacts
    location /skills/ {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OpenAPI schema & docs proxies
    location = /api/openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 20s;
    }

    location /assets/ { try_files $uri =404; expires 1y; }

    location / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        expires -1;
    }
}
